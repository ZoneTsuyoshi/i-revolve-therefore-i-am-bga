# CI（lint）第 1〜3 段階（2b を含む）。仕様書: docs/specs/004-ci-lint.md
# 必須チェックは gate（表示名 "Lint gate"）のみ。段階が進んだら gate の needs にジョブを足す。
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # bga-sync.yml が lint を再利用ワークフローとして呼ぶ（仕様書 004 §1）
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

      # 内部リンクのみ検査する（offline は lychee.toml で指定）
      - name: lychee (internal links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml './**/*.md'
          fail: true

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action が PR のコミット範囲を API で取得するために読み取りのみ必要（コメントは無効）
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  repo:
    name: Repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # R1 は追跡ファイルの状態を見るので全履歴は要らない
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # 外部依存なしのスクリプトなので npm ci は不要
      - name: Forbidden files, src/ hygiene, data/ and doc links
        if: ${{ !cancelled() }}
        run: npm run lint:repo

      # 自己テスト（check-assets は sharp を使う）と生成物（Material/・src/img/）の整合検査のため、ここで依存を入れる
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Self-test of lint scripts
        if: ${{ !cancelled() }}
        run: npm run test:lint

      - name: Card data consistency (002)
        if: ${{ !cancelled() }}
        run: npm run check:cards

      - name: Sprite consistency (009)
        if: ${{ !cancelled() }}
        run: npm run check:sprites

  # PHP の構文（parallel-lint）と規約（phpcs）。src/ に PHP が無い間はスキップして成功する（仕様書 004 §3）
  php:
    name: PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        if: ${{ hashFiles('src/**/*.php') != '' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      # vendor/ はキャッシュしない（setup-php の注意）。Composer のダウンロードキャッシュのみ
      - name: Get Composer cache directory
        if: ${{ hashFiles('src/**/*.php') != '' }}
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        if: ${{ hashFiles('src/**/*.php') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        if: ${{ hashFiles('src/**/*.php') != '' }}
        run: composer install --no-interaction --no-progress --prefer-dist

      # php-parallel-lint（構文）と PHP_CodeSniffer（規約）。対象は src と tests。静的解析（PHPStan）は static ジョブ
      - name: composer lint
        if: ${{ hashFiles('src/**/*.php') != '' }}
        run: composer lint

  node:
    name: JS / CSS / JSONC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先行ステップが失敗しても続けて、1 回の実行で全エラーを見えるようにする。
      # 対象ファイルが無いときは各ツールが対象 0 件で成功する（ESLint は設定ファイルなどを常に検査する）
      - name: ESLint (JS and JSONC)
        if: ${{ !cancelled() }}
        run: npm run lint:js

      - name: declare(strict_types=1) in PHP
        if: ${{ !cancelled() }}
        run: npm run lint:strict

      - name: ir prefix for framework subclasses
        if: ${{ !cancelled() }}
        run: npm run lint:prefix

      - name: Stylelint
        if: ${{ !cancelled() }}
        run: npm run lint:css

  # PHPStan と tsc は BGA の開発用スタブ（再配布不可でコミットしない）が必要。
  # Studio から SFTP で取得して実行する。Secrets / Variables が無いとき（フォークの PR、
  # Dependabot の PR、Secrets を渡さない workflow_call 経由）は警告つきでスキップして成功する。
  # 仕様書 004 §2.6、005
  static:
    name: Static analysis (BGA stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: config
        env:
          HAS_KEY: ${{ secrets.BGA_SSH_PRIVATE_KEY != '' }}
          HAS_USER: ${{ secrets.BGA_SFTP_USER != '' }}
          HAS_HOST: ${{ vars.BGA_SFTP_HOST != '' }}
          HAS_PORT: ${{ vars.BGA_SFTP_PORT != '' }}
          HAS_DIR: ${{ vars.BGA_REMOTE_DIR != '' }}
          HAS_KNOWN_HOSTS: ${{ vars.BGA_SSH_KNOWN_HOSTS != '' }}
        run: |
          missing=""
          [ "$HAS_KEY" = true ] || missing="$missing BGA_SSH_PRIVATE_KEY(Secret)"
          [ "$HAS_USER" = true ] || missing="$missing BGA_SFTP_USER(Secret)"
          [ "$HAS_HOST" = true ] || missing="$missing BGA_SFTP_HOST(Variable)"
          [ "$HAS_PORT" = true ] || missing="$missing BGA_SFTP_PORT(Variable)"
          [ "$HAS_DIR" = true ] || missing="$missing BGA_REMOTE_DIR(Variable)"
          [ "$HAS_KNOWN_HOSTS" = true ] || missing="$missing BGA_SSH_KNOWN_HOSTS(Variable)"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PHPStan / tsc skipped::Secrets / Variables が無いためスキップ:$missing"
            {
              echo "## PHPStan と tsc をスキップしました"
              echo
              echo "BGA Studio からスタブを取得できないため実行していません（フォーク・Dependabot の PR などでは正常）。未設定:$missing"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        if: steps.config.outputs.ready == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # 依存のインストール（スクリプトが走る）は、秘密鍵を書き出す前に済ませる
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Install lftp
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # 秘密鍵は printf でファイルに書く（echo しない・set -x しない）。権限 600
      - name: Prepare SSH key
        if: steps.config.outputs.ready == 'true'
        env:
          BGA_SSH_PRIVATE_KEY: ${{ secrets.BGA_SSH_PRIVATE_KEY }}
          BGA_SSH_KNOWN_HOSTS: ${{ vars.BGA_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          install -m 600 /dev/null "$RUNNER_TEMP/bga_key"
          printf '%s\n' "$BGA_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bga_key"
          printf '%s\n' "$BGA_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/bga_known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/bga_key" > /dev/null 2>&1 \
            || { echo "::error::BGA_SSH_PRIVATE_KEY の形式が不正です（改行が壊れていないか確認）"; exit 1; }

      - name: Fetch BGA stubs
        if: steps.config.outputs.ready == 'true'
        env:
          BGA_KEY_FILE: ${{ runner.temp }}/bga_key
          BGA_KNOWN_HOSTS_FILE: ${{ runner.temp }}/bga_known_hosts
          BGA_SFTP_USER: ${{ secrets.BGA_SFTP_USER }}
          BGA_SFTP_HOST: ${{ vars.BGA_SFTP_HOST }}
          BGA_SFTP_PORT: ${{ vars.BGA_SFTP_PORT }}
          BGA_REMOTE_DIR: ${{ vars.BGA_REMOTE_DIR }}
        run: scripts/lint/fetch-bga-stubs.sh

      - name: Remove SSH key
        if: always() && steps.config.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/bga_key" "$RUNNER_TEMP/bga_known_hosts"

      # 先行ステップが失敗しても続けて、1 回の実行で全エラーを見えるようにする
      - name: PHPStan
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: composer lint:stan

      - name: tsc
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: npm run lint:types -- --require

  # コミット済みの src/img/ の上限検査（仕様書 004 §2.9）。生成はせず、原本も不要
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Image limits (src/img)
        run: npm run lint:assets

  gate:
    name: Lint gate
    if: ${{ always() }}
    # 段階が進むたびにジョブを追加する（第 4 段階の PHPUnit は別ワークフロー Test で、ここに含めない）
    needs: [markdown, secrets, repo, php, node, static, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all lint jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"' && exit 1 || exit 0
