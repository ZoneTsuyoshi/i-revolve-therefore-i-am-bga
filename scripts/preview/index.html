<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Revolve, Therefore I Am preview</title>
  <link rel="stylesheet" href="/src/irevolvethereforeiam.css">
  <link rel="stylesheet" href="/scripts/preview/preview.css">
</head>
<body id="ebd-body">
  <div id="pv-topbar" class="pv-topbar">Board Game Arena (preview)</div>
  <div id="pv-error" class="pv-error" hidden></div>
  <!-- BGA の標準の構造に寄せる: #page-title の中に #pagemaintitletext（文）と #generalactions（ボタン）。トップバーの下に貼り付く（sticky）。仕様書 011 §9.1 -->
  <div id="page-title" class="pv-statusbar">
    <div id="pagemaintitletext" class="pv-title"></div>
    <div id="generalactions" class="pv-buttons"></div>
  </div>
  <div id="pv-page" class="pv-page">
    <div id="game_play_area" class="pv-gamearea"></div>
    <aside id="pv-panels" class="pv-panels"></aside>
  </div>
  <div id="pv-footer" class="pv-footer">BGA footer (preview)</div>
  <script type="module" src="/scripts/preview/preview.js"></script>
</body>
</html>
